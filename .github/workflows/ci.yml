name: BoardSnap CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            vision/requirements-test.txt
            llm/requirements.txt

      - name: Test Vision pipeline without downloading model weights
        working-directory: vision
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest test_vision.py
          python test_pipeline.py

      - name: Test LLM Gemini integration
        working-directory: llm
        run: |
          python -m pip install -r requirements.txt
          python -m unittest test_main.py

      - name: Validate Docker Compose configuration
        run: |
          cp vision/.env.example vision/.env
          cp llm/.env.example llm/.env
          docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare non-secret service configuration
        run: |
          cp vision/.env.example vision/.env
          cp llm/.env.example llm/.env

      - name: Build application service images
        run: docker compose build backend vision llm frontend
